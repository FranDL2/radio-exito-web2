backend:
  name: git-gateway
  branch: main

# Ver README.md para activar Identity + Git Gateway en Netlify.
# Eso es lo que permite que tu papá inicie sesión en /admin sin
# necesidad de un backend propio.

media_folder: "src/assets/img/noticias"
public_folder: "/assets/img/noticias"

publish_mode: simple

collections:
  - name: "noticias"
    label: "Noticias"
    label_singular: "Noticia"
    folder: "src/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{categoria}}"
    sortable_fields: ["date", "title", "categoria"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de publicación", name: "date", widget: "datetime" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "La Cruz", value: "la-cruz" }
          - { label: "Economía", value: "economia" }
          - { label: "Consumo", value: "consumo" }
          - { label: "Paso de los Libres", value: "paso-de-los-libres" }
          - { label: "Judiciales", value: "judiciales" }
          - { label: "Santo Tomé", value: "santo-tome" }
          - { label: "Interior Provincial", value: "interior-provincial" }
          - { label: "Deportes", value: "deportes" }
          - { label: "Educación", value: "educacion" }
          - { label: "Policiales", value: "policiales" }
          - { label: "Política", value: "politica" }
          - { label: "Ciudad de Corrientes", value: "ciudad-de-corrientes" }
      - { label: "Foto de portada", name: "imagen", widget: "image", required: false, hint: "Se recomienda una imagen horizontal (formato apaisado)." }
      - { label: "Texto alternativo de la foto", name: "imagenAlt", widget: "string", required: false, hint: "Describe la imagen para lectores de pantalla y buscadores." }
      - { label: "Bajada / resumen breve", name: "resumen", widget: "text", required: false }
      - { label: "Destacar en \"Noticias destacadas\"", name: "destacada", widget: "boolean", default: false }
      - { label: "Marcar como ÚLTIMA HORA", name: "ultimaHora", widget: "boolean", default: false, hint: "Usar sólo para noticias urgentes reales, no para todo." }
      - { label: "Etiquetas (opcional, separadas por coma)", name: "etiquetas", widget: "list", required: false }
      - { label: "Contenido de la noticia", name: "body", widget: "markdown" }

  - name: "programacion"
    label: "Programación"
    label_singular: "Programa"
    folder: "src/programacion"
    create: true
    slug: "{{slug}}"
    identifier_field: nombre
    summary: "{{nombre}} — {{horaInicio}} a {{horaFin}}"
    sortable_fields: ["nombre", "horaInicio"]
    fields:
      - { label: "Nombre del programa", name: "nombre", widget: "string" }
      - { label: "Conductor/a", name: "conductor", widget: "string", required: false }
      - { label: "Hora de inicio (formato 24hs, ej: 09:00)", name: "horaInicio", widget: "string" }
      - { label: "Hora de finalización (formato 24hs, ej: 12:00)", name: "horaFin", widget: "string" }
      - label: "Días de emisión"
        name: "dias"
        widget: "select"
        multiple: true
        options: ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"]
      - { label: "Descripción", name: "descripcion", widget: "text", required: false }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Activo (se muestra en la grilla)", name: "activo", widget: "boolean", default: true }

  - name: "equipo"
    label: "Equipo"
    label_singular: "Integrante"
    folder: "src/equipo"
    create: true
    slug: "{{slug}}"
    identifier_field: nombre
    summary: "{{nombre}} — {{funcion}}"
    fields:
      - { label: "Nombre y apellido", name: "nombre", widget: "string" }
      - { label: "Función (ej: Conductor/a, Periodista, Productor/a)", name: "funcion", widget: "string" }
      - { label: "Programa (opcional)", name: "programa", widget: "string", required: false }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Biografía breve", name: "bio", widget: "text", required: false }
      - { label: "Instagram (enlace completo)", name: "instagram", widget: "string", required: false }
      - { label: "X / Twitter (enlace completo)", name: "twitter", widget: "string", required: false }
      - { label: "Orden de aparición", name: "orden", widget: "number", default: 10, required: false }
      - { label: "Activo (se muestra en /equipo)", name: "activo", widget: "boolean", default: true }

  - name: "config_sitio"
    label: "Configuración del sitio"
    files:
      - label: "Datos de contacto y redes sociales"
        name: "contacto"
        file: "src/_data/contacto.json"
        fields:
          - { label: "Enlace de WhatsApp (formato: https://api.whatsapp.com/send?phone=549...)", name: "whatsapp", widget: "string" }
          - { label: "WhatsApp (texto a mostrar)", name: "whatsappTexto", widget: "string", required: false }
          - { label: "Teléfono", name: "telefono", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Dirección", name: "direccion", widget: "string" }
          - { label: "Facebook (enlace completo)", name: "facebook", widget: "string", required: false }
          - { label: "Instagram (enlace completo)", name: "instagram", widget: "string", required: false }
          - { label: "YouTube (enlace completo)", name: "youtube", widget: "string", required: false }
          - { label: "X / Twitter (enlace completo)", name: "twitter", widget: "string", required: false }

      - label: "Sponsors y banners publicitarios"
        name: "sponsors"
        file: "src/_data/sponsors.json"
        fields:
          - label: "Banners"
            name: "items"
            widget: "list"
            summary: "{{fields.nombre}} — {{fields.posicion}}"
            fields:
              - { label: "Nombre del sponsor", name: "nombre", widget: "string" }
              - { label: "Imagen del banner", name: "imagen", widget: "image", required: false, media_folder: "/src/assets/img/sponsors", public_folder: "/assets/img/sponsors" }
              - { label: "Enlace al hacer clic", name: "url", widget: "string", required: false }
              - label: "Dónde se muestra"
                name: "posicion"
                widget: "select"
                default: "sidebar"
                options:
                  - { label: "Barra lateral", value: "sidebar" }
                  - { label: "Portada (inicio)", value: "home" }
                  - { label: "Pie de página", value: "footer" }
                  - { label: "Todas las posiciones", value: "todas" }
              - { label: "Activo", name: "activo", widget: "boolean", default: true }
              - { label: "Fecha de inicio (opcional)", name: "inicio", widget: "date", required: false }
              - { label: "Fecha de finalización (opcional)", name: "fin", widget: "date", required: false }

      - label: "Página \"Nosotros\""
        name: "nosotros"
        file: "src/_data/nosotros.json"
        fields:
          - { label: "Título principal", name: "titulo", widget: "string" }
          - { label: "Texto de introducción", name: "intro", widget: "text" }
          - { label: "Título — Misión", name: "misionTitulo", widget: "string" }
          - { label: "Texto — Misión", name: "misionTexto", widget: "text" }
          - { label: "Título — Compromiso", name: "compromisoTitulo", widget: "string" }
          - { label: "Texto — Compromiso", name: "compromisoTexto", widget: "text" }

      - label: "Página \"Publicidad\""
        name: "publicidad"
        file: "src/_data/publicidad.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Texto de introducción", name: "intro", widget: "text" }
          - { label: "Canales (uno por línea)", name: "canales", widget: "list" }
          - { label: "Formatos publicitarios (uno por línea)", name: "formatos", widget: "list" }
          - { label: "Texto del botón", name: "cta", widget: "string" }
          - { label: "Mensaje prearmado de WhatsApp", name: "mensajeWhatsapp", widget: "string", required: false }

      - label: "Datos generales de la emisora"
        name: "sitio"
        file: "src/_data/site.json"
        fields:
          - { label: "Nombre", name: "nombre", widget: "string" }
          - { label: "Frecuencia", name: "frecuencia", widget: "string" }
          - { label: "Eslogan", name: "eslogan", widget: "string" }
          - { label: "URL del sitio", name: "url", widget: "string" }
          - { label: "URL del stream de audio (HTTP, la que da el proveedor)", name: "streamUrl", widget: "string" }
          - { label: "URL segura del stream (HTTPS, opcional)", name: "streamUrlSSL", widget: "string", required: false, hint: "Completar cuando el proveedor de streaming (o el proxy de streaming-proxy/) entregue una URL con https://. El reproductor la va a usar automáticamente en vez de la URL HTTP." }
          - { label: "URL de metadata \"Ahora suena\" (opcional)", name: "nowPlayingUrl", widget: "string", required: false, hint: "URL JSON del servidor de streaming con el tema/artista actual (por ejemplo, un endpoint de Centova o Icecast tipo /status-json.xsl). Dejar vacío si no se sabe si existe: el sitio no inventa esta información." }
          - { label: "ID de Google Analytics 4 (opcional)", name: "gaId", widget: "string", required: false, hint: "Formato G-XXXXXXXXXX. Vacío = no se activa ninguna analítica." }
