backend:
  name: git-gateway
  branch: main

# Ver README.md para activar Identity + Git Gateway en Netlify.
# Eso es lo que permite que tu papá inicie sesión en /admin sin
# necesidad de un backend propio.

media_folder: "src/assets/img/noticias"
public_folder: "/assets/img/noticias"

publish_mode: simple

collections:
  - name: "noticias"
    label: "Noticias"
    label_singular: "Noticia"
    folder: "src/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{categoria}}"
    sortable_fields: ["date", "title", "categoria"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de publicación", name: "date", widget: "datetime" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "La Cruz", value: "la-cruz" }
          - { label: "Economía", value: "economia" }
          - { label: "Consumo", value: "consumo" }
          - { label: "Paso de los Libres", value: "paso-de-los-libres" }
          - { label: "Judiciales", value: "judiciales" }
          - { label: "Santo Tomé", value: "santo-tome" }
          - { label: "Interior Provincial", value: "interior-provincial" }
          - { label: "Deportes", value: "deportes" }
          - { label: "Educación", value: "educacion" }
          - { label: "Policiales", value: "policiales" }
          - { label: "Política", value: "politica" }
          - { label: "Ciudad de Corrientes", value: "ciudad-de-corrientes" }
      - { label: "Foto de portada", name: "imagen", widget: "image", required: false, hint: "Se recomienda una imagen horizontal (formato apaisado)." }
      - { label: "Texto alternativo de la foto", name: "imagenAlt", widget: "string", required: false, hint: "Describe la imagen para lectores de pantalla y buscadores." }
      - { label: "Bajada / resumen breve", name: "resumen", widget: "text", required: false }
      - { label: "Destacar en \"Lo más leído\"", name: "destacada", widget: "boolean", default: false }
      - { label: "Contenido de la noticia", name: "body", widget: "markdown" }

  - name: "config_sitio"
    label: "Configuración del sitio"
    files:
      - label: "Datos de contacto y redes sociales"
        name: "contacto"
        file: "src/_data/contacto.json"
        fields:
          - { label: "Enlace de WhatsApp (formato: https://api.whatsapp.com/send?phone=549...)", name: "whatsapp", widget: "string" }
          - { label: "WhatsApp (texto a mostrar)", name: "whatsappTexto", widget: "string", required: false }
          - { label: "Teléfono", name: "telefono", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Dirección", name: "direccion", widget: "string" }
          - { label: "Facebook (enlace completo)", name: "facebook", widget: "string", required: false }
          - { label: "Instagram (enlace completo)", name: "instagram", widget: "string", required: false }
          - { label: "YouTube (enlace completo)", name: "youtube", widget: "string", required: false }
          - { label: "X / Twitter (enlace completo)", name: "twitter", widget: "string", required: false }

      - label: "Sponsors y banners publicitarios"
        name: "sponsors"
        file: "src/_data/sponsors.json"
        fields:
          - label: "Banners"
            name: "items"
            widget: "list"
            summary: "{{fields.nombre}}"
            fields:
              - { label: "Nombre del sponsor", name: "nombre", widget: "string" }
              - { label: "Imagen del banner", name: "imagen", widget: "image", required: false, media_folder: "/src/assets/img/sponsors", public_folder: "/assets/img/sponsors" }
              - { label: "Enlace al hacer clic", name: "url", widget: "string", required: false }

      - label: "Datos generales de la emisora"
        name: "sitio"
        file: "src/_data/site.json"
        fields:
          - { label: "Nombre", name: "nombre", widget: "string" }
          - { label: "Frecuencia", name: "frecuencia", widget: "string" }
          - { label: "Eslogan", name: "eslogan", widget: "string" }
          - { label: "URL del sitio", name: "url", widget: "string" }
          - { label: "URL del stream de audio (HTTP, la que da el proveedor)", name: "streamUrl", widget: "string" }
          - { label: "URL segura del stream (HTTPS, opcional)", name: "streamUrlSSL", widget: "string", required: false, hint: "Completar cuando el proveedor de streaming (o el proxy de streaming-proxy/) entregue una URL con https://. El reproductor la va a usar automáticamente en vez de la URL HTTP." }
